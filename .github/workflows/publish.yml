name: Build, Pack, and Publish NuGet Package

on:
  push:
    branches:
      - master

env:
  BUILD_CONFIGURATION: 'Release'
  MAJOR_VERSION: 1
  MINOR_VERSION: 0
  # github.run_number increments with each build (equivalent to the Azure counter)
  PACKAGE_VERSION: "1.0.${{ github.run_number }}"

jobs:
  build-pack-publish:
    runs-on: windows-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore

      - name: Build Project
        run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Pack Project as NuGet Package
        run: |
          dotnet pack --configuration ${{ env.BUILD_CONFIGURATION }} \
            --output ./packages \
            /p:PackageVersion=${{ env.PACKAGE_VERSION }} \
            --no-build

      - name: Publish NuGet Package to GitHub Packages
        run: |
          dotnet nuget push "./packages/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate